name: "OpenCode PR Review"
description: >
  AI-powered GitHub pull request review using OpenCode
  and OpenAgentsControl.
author: "fasenderos"

inputs:
  model:
    description: >
      OpenCode model in provider/model format.
      If omitted, OpenCode uses its configured default model.
    required: false
    default: "opencode/deepseek-v4-flash-free"

  api_key:
    description: >
      API key for the configured model provider.
      Prefer passing this through GitHub Secrets.
    required: false

  agent:
    description: >
      OpenCode agent to use for the review.
    required: false
    default: "code-reviewer"

  opencode_version:
    description: >
      OpenCode npm package version.
      Use "latest" or a pinned version.
    required: false
    default: "latest"

  oac_ref:
    description: >
      Git reference of OpenAgentsControl to use.
      This can be a tag, branch, or commit SHA.
    required: false
    default: "main"

  github_token:
    description: >
      GitHub token used to read pull request information.
    required: true
    default: ${{ github.token }}

outputs:
  changed_files:
    description: "Number of files changed in the pull request"

  reviewable_files:
    description: "Number of files with a reviewable patch"

  review:
    description: "Raw structured review result"

runs:
  using: "node24"
  main: "dist/index.js"