name: Test Action

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test OpenCode PR Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build action
        run: |
          npm ci
          npm run build

      - name: Run OpenCode PR Review
        uses: ./
        with:
          github_token: ${{ github.token }}
          agent: code-reviewer
          opencode_version: latest
          oac_ref: main